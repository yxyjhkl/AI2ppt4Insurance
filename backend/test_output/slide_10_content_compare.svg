  <text x="24" y="38" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#ffffff">技术债务清理：Before vs After</text>
  <line x1="40" y1="75" x2="1240" y2="75" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="640" y1="90" x2="640" y2="690" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="48" y="100" width="580" height="30" rx="4" fill="#ecfdf5"/>
  <text x="60" y="120" font-family="Microsoft YaHei" font-size="16" font-weight="bold" fill="#059669">Before / 现状</text>
  <text x="48" y="160" font-family="Microsoft YaHei" font-size="16" fill="#1f2937"><tspan>• 🔴 单体应用 23万行代码，部署周期 2周
