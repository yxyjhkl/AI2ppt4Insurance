<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect y="0" width="1280" height="60" fill="#1e40af"/>
  <rect y="0" width="6" height="60" fill="#f59e0b"/>
  <text x="24" y="38" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#ffffff">核心API网关配置示例</text>
  <line x1="40" y1="75" x2="1240" y2="75" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="48" y="95" width="1200" height="550" rx="6" fill="#1e293b"/>
  <rect x="48" y="95" width="1200" height="36" rx="6" fill="#334155"/>
  <rect x="48" y="119" width="1200" height="12" fill="#334155"/>
  <text x="64" y="119" font-family="Consolas, monospace" font-size="15" fill="#e5e7eb"><text x="64" y="155" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">apiVersion: gateway.example.com/v1</text>
<text x="64" y="177" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">kind: Gateway</text>
<text x="64" y="199" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">metadata:</text>
<text x="64" y="221" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  name: production-gateway</text>
<text x="64" y="243" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  namespace: prod-infra</text>
<text x="64" y="265" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">spec:</text>
<text x="64" y="287" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  replicas: 6</text>
<text x="64" y="309" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  resources:</text>
<text x="64" y="331" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    cpu: 4000m</text>
<text x="64" y="353" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    memory: 8Gi</text>
<text x="64" y="375" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  rateLimit:</text>
<text x="64" y="397" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    maxQPS: 50000</text>
<text x="64" y="419" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    burst: 10000</text>
<text x="64" y="441" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  observability:</text>
<text x="64" y="463" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    tracing: enabled</text>
<text x="64" y="485" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    metricsExport: prometheus</text>
<text x="64" y="507" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    logLevel: info</text>
<text x="64" y="529" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">  security:</text>
<text x="64" y="551" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    mtlsEnabled: true</text>
<text x="64" y="573" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    jwtValidation: RS256</text>
<text x="64" y="595" font-family="Consolas, monospace" font-size="14" fill="#e5e7eb">    certificateIssuer: cert-manager-v2</text></text>
  <rect y="690" width="1280" height="30" fill="#f0f4ff"/>
  <text x="1240" y="710" text-anchor="end" font-family="Arial" font-size="12" fill="#9ca3af">8</text>
</svg>