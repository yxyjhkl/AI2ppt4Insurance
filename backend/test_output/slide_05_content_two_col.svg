<text x="40" y="266" font-family="Microsoft YaHei" font-size="20" fill="#1f2937">• 客单价 ¥280,000/年，毛利率 62%</text>
<text x="40" y="305" font-family="Microsoft YaHei" font-size="20" fill="#1f2937">• 中标率提升至 38%（行业平均 22%）</text></text>
