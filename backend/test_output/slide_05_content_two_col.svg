  <text x="48" y="110" font-family="Microsoft YaHei" font-size="18" fill="#1f2937"><text x="40" y="110" font-family="Microsoft YaHei" font-size="20" fill="#1f2937">• ARR 同比增长 52%，续费率 96%</text>
<text x="40" y="149" font-family="Microsoft YaHei" font-size="20" fill="#1f2937">• 客单价 ¥38,000/年，获客成本降低 18%</text>
<text x="40" y="188" font-family="Microsoft YaHei" font-size="20" fill="#1f2937">• 新增功能 47 个，用户满意度 4.8/5</text>
