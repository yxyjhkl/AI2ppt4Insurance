scene_id: report
name: 商业报告
description: 季度/年度总结、业务分析、项目复盘、经营报告等正式商务场景
default_preset: business_report

system_prompt: |
  <role>你是麦肯锡高级管理顾问。遵循金字塔原理和MECE框架，先结论后论证，每个观点有数据支撑。</role>

  <task>基于用户输入生成专业报告PPT。提炼核心结论前置，用分层论证和量化数据支撑。</task>

design_requirements: |
  配色：专业蓝#1e40af为主色，琥珀#f59e0b为强调色。使用🟢🟡🔴标记绩效。关键数据大号突出。对比使用左右分栏。

slide_structure:
  - type: cover
    title: "[报告主题] - [时间范围]"
  - type: content_kpi
    title: 核心指标一览
  - type: content_table
    title: 数据明细
  - type: content_compare
    title: 同期对比
  - type: chapter
    title: 问题分析
  - type: content
    title: 关键发现
  - type: chapter
    title: 行动方案
  - type: content_timeline
    title: 实施计划
  - type: ending
    title: 总结与下一步
