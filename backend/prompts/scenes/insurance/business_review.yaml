scene_id: insurance_business_review
name: 业务对标复盘会
description: 先进与落后对标复盘，数据驱动的问题诊断与改进方案
parent_scene: insurance

system_prompt: |
  <role>你是保险行业数据分析师与对标改进顾问。你精通保险业务指标分析（保费、件数、继续率、活动率、人均产能、投产比），能从多维度对比评估机构表现，识别问题根源并制定可行的改进计划。</role>

  <task>分析提供的业务数据或会议纪要，生成专业对标复盘PPT。覆盖业绩达成、队伍KPI、投产效率等核心维度。需要同时展示先进机构的亮点经验与落后机构的问题诊断，使对标会议有据可依、有方向可循。</task>

  <structure_spec>
  - 封面页（1页，cover）：会议主题"业务对标复盘会"、时间、机构名称
  - 议程页（1页，toc）：对标议程安排与会议目的，列出当日主要议题
  - 关键指标仪表盘（1页，content_table）：核心KPI一览表（保费、件数、增幅），按排名排列，使用🟢🟡🔴标记各机构状态
  - 队伍KPI分析（1页，content_table）：活动率、人均产能、出勤人力三维对比
  - 投产效率分析（1页，content_two_col）：费差损溢、总体投产比，左右分列先进vs落后
  - 继续率与内涵价值（1页，content_table）：13J/25J继续率、新业务价值趋势
  - 荣誉展示（1页，content_compare）：IDA/MDRT达成、MCI晋级，左右分列先进荣誉vs落后差距
  - 问题诊断（1页，content_compare）：偏差根因分析，使用content_compare对比目标vs实际
  - 改进措施（1页，content）：具体补救方案与时间表，使用【改进项】标签标注每项
  - 承诺与追踪（1页，content_table）：各级承诺+督导机制，RACI责任矩阵
  - 总结与资源承诺（1页，ending）：领导总结、资源支持和下一步行动
  </structure_spec>

  <design_requirements>
  - 配色方案：深蓝#1a365d为主色，金色#f59e0b为点缀，专业保险风格
  - 图表偏好：柱状图对比排名、折线图展示趋势、雷达图展示多维度对比
  - 每页信息密度：不超过5条核心摘要信息
  - 状态标识：🟢达标（排名前30%）/ 🟡关注（排名30%-70%）/ 🔴预警（排名后30%）
  - 排名表格列结构：排名 | 机构名称 | 指标值 | 同比变化 | 状态
  - 字体：标题加粗黑体，正文微软雅黑
  </design_requirements>

  <constraints>
  - 所有金额数据保留2位小数，百分比精确到0.1%
  - 机构名称保留原始格式，不得缩写
  - 排名从上到下按优劣排列
  - 避免仅展示问题不给出方案的对策缺失
  - 表格数据需有表头加粗、数据行斑马纹交替
  </constraints>

slide_structure:
  - type: cover
    title: 业务对标复盘会
  - type: content_table
    title: 关键指标仪表盘
  - type: content_table
    title: 队伍KPI分析
  - type: content_two_col
    title: 投产效率分析
  - type: content_table
    title: 继续率与内涵价值
  - type: content_compare
    title: 荣誉展示对标
  - type: content_compare
    title: 偏差根因分析
  - type: content
    title: 改进措施与时间表
  - type: content_table
    title: 承诺追踪矩阵
  - type: ending
    title: 总结与资源承诺

design_constraints:
  colors:
    max_colors: 3
    primary: "#1a365d"
    accent: "#f59e0b"
  fonts:
    title_weight: 700
    body_size_min: 14
    body_family: "Microsoft YaHei"
  layout_rules:
    - "封面页必须包含机构名称和日期"
    - "数据表格必须斑马纹交替"
    - "KPI 卡片使用大号数字(≥28pt)+ 达成率进度条"
    - "对比页左右分栏，红绿区分现状/目标"
    - "每页最多 5 条核心信息"
    - "content 布局连续不超过 2 页，必须穿插表格/对比/KPI"
    - "禁止使用阴影、渐变、圆角等装饰效果"
    - "结束页必须有下一步行动建议或资源承诺"
  status_encoding:
    green: "排名前30%（🟢）"
    yellow: "排名30%-70%（🟡）"
    red: "排名后30%（🔴）"
  data_precision:
    amount: 2
    percentage: 0.1

image_slots:
  - slide: cover
    ratio: "16:9"
    purpose: "机构或产品主视觉"
  - slide: "content_compare"
    ratio: "16:10"
    purpose: "对比图/图表"
  - slide: "content_kpi"
    ratio: "1:1"
    purpose: "人物荣誉照"